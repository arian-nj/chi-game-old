syntax = "proto3";

package xo_game.v1;

option go_package = "backend/gen/xo_game/v1;xogamev1";

message Move {
  int32 cell_value = 1;
  int32 cell_index = 2;
}

message Play {
  int32 cell_index = 1;
}

message PlayResponse {
  bool is_valid = 1;
  Move move = 2;
  string reason = 3;
}

message XoGameMessage {
  oneof payload {
    Move move = 1;
    Play play = 2;
    PlayResponse play_response = 3;
  }
}
