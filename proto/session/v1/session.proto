syntax = "proto3";

package session.v1;

import "account/v1/account.proto";
import "xo_game/v1/xo.proto";
import "conn4_game/v1/conn4.proto";

// Chat
message ChatMessageRequest {
  string text = 1;
}
message ChatMessage {
  int64 player_id = 1;
  string text = 2;
  int64 id = 3;
}

// Game Session
message GameMessage {
  oneof game {
    xo_game.v1.XoGameMessage xo = 1;
    conn4_game.v1.Conn4GameMessage conn4 = 2;
  }
}

// GameType Message
enum GameType {
  GAME_TYPE_UNSPECIFIED = 0;
  GAME_TYPE_XO3X3 = 1;
  GAME_TYPE_XO5X5 = 2;
  GAME_TYPE_CONN4 = 3;
}
message ChangeGameTypeMessage {
  GameType game_type = 1;
}

/// Session
message SessionMessage {
  oneof content {
    ChatMessage chat = 1;
    ChatMessageRequest chat_req = 2;
    GameMessage game = 3;
    SessionErrorType error = 4;
    ChangeGameTypeMessage game_type = 5;
  }
}

service SessionService {
  rpc GetChatHistory(GetChatHistoryRequest) returns (GetChatHistoryResponse) {}
  rpc GetSessionOpponent(GetSessionOpponentRequest) returns (GetSessionOpponentResponse) {}
  rpc HasSession(HasSessionRequest) returns (HasSessionResponse) {}
}

message HasSessionRequest {}
message HasSessionResponse {
  bool has_session= 1;
}

message GetChatHistoryRequest {}
message GetChatHistoryResponse {
  repeated ChatMessage messages = 1;
}

message GetSessionOpponentRequest {}
message GetSessionOpponentResponse {
  account.v1.Account opponent = 1;
}

enum SessionErrorType {
  SESSION_ERROR_TYPE_UNSPECIFIED = 0;
  SESSION_ERROR_TYPE_AUTH = 1;
  SESSION_ERROR_TYPE_NOSESSION = 2;
}
