syntax = "proto3";

package session.v1;

import "xo_game/v1/xo.proto";

message ChatMessageRequest {
  string text = 1;
}

message ChatMessage {
  int32 player_id = 1;
  string text = 2;
}

message GameMessage {
  oneof game {
    xo_game.v1.XoGameMessage xo = 1;
  }
}

message SessionMessage {
  oneof content {
    ChatMessage chat = 1;
    ChatMessageRequest chat_req = 2;
    GameMessage game = 3;
  }
}
