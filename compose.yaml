services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: pgadmin
      POSTGRES_PASSWORD: pgpass
      POSTGRES_DB: game
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready" ,"-U","pgadmin","-d", "game"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
