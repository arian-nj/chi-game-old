services:
  frontend:
    image: ghcr.io/arian-nj/chi-game:${GIT_COMMIT_HASH}
    build:
      context: .
      dockerfile: front.Dockerfile

    environment:
      - RELEASE_MODE=release

  backend:
    image: ghcr.io/arian-nj/chi-game:${GIT_COMMIT_HASH}
    build:
      context: .
      dockerfile: back.Dockerfile

    environment:
      - RELEASE_BOT_TOKEN=8236580151:AAGhdmel90Y2eZxzEEMTThCfNvzADxXZtz0
      - RELEASE_DATABASE_URL=postgres://pgadmin:p239ijfw921ioad@db:5432/game?sslmode=disable
      - RELEASE_MODE=release

    deploy:
      update_config:
        order: start-first

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: pgadmin
      POSTGRES_PASSWORD: p239ijfw921ioad
      POSTGRES_DB: game
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Keeps data persistent
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

